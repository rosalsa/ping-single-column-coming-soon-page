<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Ping coming soon page</title>
</head>
<body>

  <main class="container">
    <header>
      <img src="./images/logo.svg" alt="Ping Logo" class="logo">
    </header>

    <section class="hero">
      <h1>We are launching <span>soon!</span></h1>
      <p>Subscribe and get notified</p>

      <form id="notify-form" novalidate>
        <div class="input-group">
          <input type="email" id="email" placeholder="Your email address..." aria-label="Email address">
          <small id="error-message" class="error-text" aria-live="polite"></small>
        </div>
        <button type="submit">Notify Me</button>
      </form>
    </section>

    <div class="dashboard-img">
      <img src="./images/illustration-dashboard.png" alt="Dashboard Preview">
    </div>

    <footer class="footer">
      <div class="social-links">
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      </div>
      <p class="copyright">&copy; Copyright Ping. All rights reserved.</p>
      <p class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="https://rosalsa.rf.gd/">Salsa</a>.
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
